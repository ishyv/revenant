[package]
name = "revenant"
version = "0.1.0"
edition = "2024"
default-run = "main"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
rayon = "1.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
walkdir = "2.5.0"
regex = "1.11.1"

[[bin]]
name = "revenantc"
path = "src/bin/revenantc.rs"


[[bin]]
name = "main"
path = "src/main.rs"