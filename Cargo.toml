[package]
name = "revenant"
version = "0.3.0"
edition = "2024"
description = "Build native desktop applications with Svelte and typed Rust capabilities"
license = "MIT"
build = "src/embed_build.rs"

[workspace]
resolver = "2"
members = ["crates/revenant-core", "crates/revenant-sdk", "crates/revenant-macros", "crates/revenant-desktop"]
exclude = ["examples", "examples/*", "apps", "apps/*", ".tooling", ".revenant", "generated-template", "generated-templates", "generated-template/*", "generated-templates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
clap       = { version = "4", features = ["derive", "color", "wrap_help"] }
anyhow     = "1.0"
thiserror  = "2.0"
colored    = "3.0"
toml       = { version = "0.8", features = ["parse"] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify     = "8.0"
ctrlc      = { version = "3.4", features = ["termination"] }
sha2       = "0.10"
dunce      = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix        = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem"] }
