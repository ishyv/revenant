[package]
name = "revenant-agent"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Local, session-owned MCP interfaces for Revenant applications"

[dependencies]
revenant-core = { version = "0.4.0", path = "../revenant-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-async-rw"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
