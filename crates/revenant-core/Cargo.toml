[package]
name = "revenant-core"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Scoped capability ownership, task lifecycle, and wire contracts"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = "1.2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
sha2 = "0.10"
jsonschema = { version = "0.33", default-features = false }
