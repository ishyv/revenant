[package]
name = "revenant-desktop"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Owned native capabilities and Tauri desktop lifecycle for Revenant"

[features]
default = ["tauri-host"]
tauri-host = ["dep:tauri", "dep:tauri-plugin-dialog"]

[dependencies]
revenant-core = { version = "0.3.0", path = "../revenant-core" }
revenant-sdk = { version = "0.3.0", path = "../revenant-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
mime_guess = "2"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
