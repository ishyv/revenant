[package]
name = "revenant-macros"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "Contract types, ordinary Rust operations, and automatic application discovery"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
