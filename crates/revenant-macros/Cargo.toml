[package]
name = "revenant-macros"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Authoritative contract derives and async operation descriptors"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "visit-mut"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
