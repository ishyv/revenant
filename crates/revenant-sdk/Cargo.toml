[package]
name = "revenant-sdk"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Typed async operations and compiled Revenant contract registration"

[dependencies]
revenant-core = { version = "0.3.0", path = "../revenant-core" }
revenant-macros = { version = "0.3.0", path = "../revenant-macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
ts-rs = { version = "12", features = ["serde-json-impl"] }
sha2 = "0.10"
